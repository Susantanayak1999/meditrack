name: MediTrack CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm install --legacy-peer-deps
      
    - name: Run Tests
      # We use the DOM environment directly via node to bypass the undici worker bug
      run: node --experimental-vm-modules node_modules/vitest/vitest.mjs run --environment jsdom
      
    - name: Build Project
      run: npm run build