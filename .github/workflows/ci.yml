name: MediTrack CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      # We use install instead of ci because of the legacy peer deps issue
      run: npm install --legacy-peer-deps
      
    - name: Run Tests
      # --run forces vitest to run once and exit, instead of watch mode
      run: npx vitest run
      
    - name: Build Project
      run: npm run build